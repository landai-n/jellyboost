<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="finGradient" gradientUnits="userSpaceOnUse"
                    x1="176" y1="82" x2="336" y2="216">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#0A1B45"/>
      <stop offset="1" stop-color="#000B25"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Mark: the launcher fin, centred on the left third. Native coords span
       x 176..336, y 82..216; scale 1.6 puts it ~256 wide. -->
  <g transform="translate(-155 10) scale(1.62)">
    <path fill="url(#finGradient)"
          d="M336 82 C290 96, 250 130, 232 176 C226 190, 224 204, 226 216 C262 214, 296 190, 316 156 C330 132, 336 106, 336 82 Z"/>
    <g stroke="url(#finGradient)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M196 116 L246 116"/>
      <path d="M182 150 L226 150"/>
      <path d="M194 188 L214 188"/>
    </g>
  </g>

  <text x="440" y="248" fill="#FFFFFF"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-1">Jellyboost</text>
  <text x="443" y="310" fill="#8FA3B8"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400">Your Jellyfin library, native on Android.</text>
</svg>
