<!-- @dsCard group="Components" name="Media cards" subtitle="PosterCard (resume/watched), ThumbCard, LibraryCard, placeholder artwork" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; padding:24px; }
  .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .card { display:flex; flex-direction:column; }
  .art { position:relative; border-radius:8px; overflow:hidden; background:linear-gradient(135deg,#292929,#202020); }
  .poster-art { width:120px; height:180px; }
  .thumb-art { width:210px; height:118px; }
  .title { margin-top:8px; font-size:14px; line-height:20px; color:#fff; }
  .subtitle { font-size:12px; line-height:16px; color:rgba(255,255,255,.7); }
  .badge { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .badge svg { width:16px; height:16px; }
  .watched { position:absolute; top:4px; left:4px; }
  .watched svg { width:16px; height:16px; fill:#00A4DC; }
  .progress-track { position:absolute; bottom:0; left:0; right:0; height:4px; background:rgba(0,0,0,.5); }
  .progress-fill { height:100%; background:#00A4DC; }
  .ring { width:16px; height:16px; border-radius:50%; border:2px solid #00A4DC; border-top-color:rgba(0,164,220,.25); }
  .placeholder-icon { width:32px; height:32px; fill:rgba(255,255,255,.7); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
</style>
<div class="row">
  <div class="card">
    <div class="art poster-art" style="background:linear-gradient(160deg,#3a4a5f,#5f7a9a)">
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 3v6h2.5L12 15.5 7.5 11H10V5h3z" fill="#00A4DC"/></svg></div>
      <div class="progress-track"><div class="progress-fill" style="width:30%"></div></div>
    </div>
    <div class="title">Arrival</div>
    <div class="subtitle">2016</div>
  </div>
  <div class="card">
    <div class="art poster-art" style="background:linear-gradient(160deg,#3a5f3f,#7fa06a)">
      <div class="watched"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
    </div>
    <div class="title">Dune</div>
    <div class="subtitle">2021</div>
  </div>
  <div class="card">
    <div class="art thumb-art" style="background:linear-gradient(160deg,#4a3a5f,#7a5f9a)">
      <div class="badge"><div class="ring"></div></div>
      <div class="progress-track"><div class="progress-fill" style="width:50%"></div></div>
    </div>
    <div class="title">1. The Bicameral Mind</div>
    <div class="subtitle">Westworld · S1E10</div>
  </div>
  <div class="card">
    <div class="art thumb-art" style="background:linear-gradient(160deg,#5f4a3a,#9a7a5f)"></div>
    <div class="title">Movies</div>
  </div>
  <div class="card">
    <div class="art poster-art">
      <svg class="placeholder-icon" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM4 18V8h16v10H4z"/></svg>
    </div>
    <div class="title">No artwork</div>
  </div>
</div>
