<!-- @dsCard group="Components" name="Batch selection" subtitle="SelectionAppBar (secondaryContainer), selected/unselected poster indicators, batch-outcome snackbar" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; padding:24px; }
  .wrap { display:flex; flex-direction:column; gap:24px; max-width:520px; }
  .appbar { height:64px; background:#4A4458; color:#E8DEF8; display:flex; align-items:center; padding:0 4px; gap:4px; }
  .icon-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-btn svg { width:24px; height:24px; fill:#E8DEF8; }
  .appbar-title { font-size:22px; flex:1; margin-left:4px; }
  .actions { display:flex; }
  .cards-row { display:flex; gap:16px; }
  .card { display:flex; flex-direction:column; }
  .art { position:relative; width:120px; height:180px; border-radius:8px; overflow:hidden; background:linear-gradient(160deg,#3a4a5f,#5f7a9a); }
  .art.selected { border:2px solid #00A4DC; box-sizing:border-box; }
  .scrim { position:absolute; inset:0; background:rgba(0,164,220,.35); }
  .indicator { position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  .indicator svg { width:20px; height:20px; }
  .title { margin-top:8px; font-size:14px; }
  .snackbar { background:#E6E1E5; color:#322F35; border-radius:4px; padding:14px 16px; font-size:14px; line-height:20px; max-width:344px; }
</style>

      <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
      <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/><rect x="2" y="11" width="20" height="2" transform="rotate(45 12 12)"/></svg></div>
      <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="none" stroke="#E8DEF8" stroke-width="1.4"/></svg></div>
    </div>
  </div>
  <div class="cards-row">
    <div class="card">
      <div class="art selected">
        <div class="scrim"></div>
        <div class="indicator"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#00A4DC"/></svg></div>
      </div>
      <div class="title">Selected</div>
    </div>
    <div class="card">
      <div class="art">

      </div>
      <div class="title">Unselected</div>

  </div>
