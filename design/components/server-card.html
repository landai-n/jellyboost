<!-- @dsCard group="Components" name="Discovered server card" subtitle="Gradient Dns badge, name/address, chevron + discovery hints" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; padding:24px; }
  .col { max-width:460px; display:flex; flex-direction:column; gap:8px; }
  .section { font-size:14px; font-weight:500; color:rgba(255,255,255,.7); }
  .card { display:flex; align-items:center; gap:16px; background:#292929; border-radius:16px; padding:12px 16px; cursor:pointer; }
  .badge { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#AA5CC3,#00A4DC); display:flex; align-items:center; justify-content:center; flex:none; }
  .badge svg { width:20px; height:20px; fill:#000; }
  .body { flex:1; min-width:0; }
  .name { font-size:16px; font-weight:600; }
  .addr { font-size:12px; color:rgba(255,255,255,.7); }
  .chev { color:rgba(255,255,255,.7); font-size:20px; }
  .hint { display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.7); padding:4px 0; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid #00A4DC; border-top-color:transparent; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
<div class="col">
  <div class="section">Servers on this network</div>
  <div class="card">
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm3 4.5A1.5 1.5 0 1 0 7 4.5a1.5 1.5 0 0 0 0 3ZM4 14h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1Zm3 4.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg></div>
    <div class="body"><div class="name">test-server</div><div class="addr">http://192.168.1.10:8096</div></div>
    <div class="chev">&#8250;</div>
  </div>
  <div class="hint"><div class="spin"></div>Searching the local network…</div>
  <div class="hint">No servers announced themselves. Enter an address below.</div>
</div>
