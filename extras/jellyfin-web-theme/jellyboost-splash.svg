<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Jellyboost splash for Jellyfin Branding (16:9, 1920x1080). The wordmark is Roboto Bold outlined
       to paths, so the file renders the same without the font installed. -->
  <defs>
    <!-- BrandGlow: secondary -> primary -> transparent, centred behind the mark. -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="960" cy="470" r="760">
      <stop offset="0" stop-color="#AA5CC3" stop-opacity="0.34"/>
      <stop offset="0.3" stop-color="#8A6FD0" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#00A4DC" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#00A4DC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="960" cy="540" r="1150">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="164" y2="138">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="576" y2="0">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#101010"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Mark: logo/ic_launcher_foreground.svg geometry, tight 168x142 viewBox, 230px tall. -->
  <g transform="translate(824 345) scale(1.62)">
    <path fill="url(#mark)" d="M164 4C118 18 78 52 60 98c-6 14-8 28-6 40 36-2 70-26 90-60 14-24 20-50 20-74z"/>
    <g stroke="url(#mark)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M24 38h50M10 72h44M22 110h20"/>
    </g>
  </g>

