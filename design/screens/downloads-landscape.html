<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; }
  .tablet { width:1000px; height:620px; margin:0 auto; overflow:hidden; position:relative; }
  .topbar { height:56px; display:flex; align-items:center; padding:0 8px; gap:4px; background:#202020; }
  .tabs { display:flex; gap:4px; flex:1; }
  .tab { display:flex; align-items:center; gap:8px; height:48px; padding:0 20px; border-radius:24px; }
  .tab.selected { background:#4A4458; }
  .tab svg { width:22px; height:22px; fill:rgba(255,255,255,.7); }
  .tab.selected svg { fill:#E8DEF8; }
  .tab span { font-size:14px; font-weight:500; color:rgba(255,255,255,.7); }
  .tab.selected span { color:#E8DEF8; }
  .topbar-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .topbar-icon svg { width:22px; height:22px; fill:rgba(255,255,255,.7); }
  .storage { padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .storage-row { display:flex; align-items:center; justify-content:space-between; }
  .storage-text { font-size:14px; color:rgba(255,255,255,.7); }
  .wifi-toggle { display:flex; align-items:center; gap:8px; }
  .wifi-label { font-size:14px; font-weight:500; color:rgba(255,255,255,.7); }
  .switch { width:36px; height:20px; border-radius:10px; background:#00A4DC; position:relative; }
  .switch::after { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:18px; }
  .usage-track { height:4px; border-radius:2px; background:rgba(255,255,255,.15); }
  .usage-fill { height:100%; border-radius:2px; background:#00A4DC; width:1.6%; }
  .primary-tabs { display:flex; border-bottom:1px solid #292929; }
  .ptab { flex:none; padding:14px 24px; font-size:14px; font-weight:500; color:rgba(255,255,255,.7); position:relative; }
  .ptab.selected { color:#00A4DC; }
  .ptab.selected::after { content:''; position:absolute; left:0; right:0; bottom:0; height:2px; background:#00A4DC; }
  .actions-bar { display:flex; gap:4px; padding:8px; }
  .bulk-btn { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:20px; font-size:13px; font-weight:500; color:#00A4DC; }
  .bulk-btn svg { width:18px; height:18px; fill:#00A4DC; }
  .bulk-btn.danger, .bulk-btn.danger svg { color:#CF6679; fill:#CF6679; }
  .q-row { padding:8px 16px; display:flex; align-items:center; gap:12px; }
  .q-art { width:48px; height:48px; border-radius:8px; flex:none; background:linear-gradient(135deg,#292929,#202020); }
  .q-text { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  .q-title { font-size:15px; }
  .q-progress-track { height:4px; border-radius:2px; background:rgba(255,255,255,.15); }
  .q-progress-fill { height:100%; border-radius:2px; background:#00A4DC; }
  .q-status { font-size:12px; color:rgba(255,255,255,.7); }
  .q-status.error { color:#CF6679; }
  .q-actions { display:flex; gap:0; flex:none; }
  .q-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .q-icon svg { width:18px; height:18px; fill:rgba(255,255,255,.7); }
</style>
