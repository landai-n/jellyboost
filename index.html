<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellyboost</title>
<style>
  :root { --bg: #ffffff; --ink: #1c2229; --muted: #5b6873; --accent: #0a6e9e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10151a; --ink: #e4eaf0; --muted: #93a1ad; --accent: #4fb3e0; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { letter-spacing: -.015em; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Jellyboost</h1>
  <p>A 100% native Android client for <a href="https://jellyfin.org">Jellyfin</a>.
  Unofficial — not affiliated with the Jellyfin project.</p>
  <p><a href="https://github.com/landai-n/jellyboost">Source code</a> ·
  <a href="privacy-policy.html">Privacy policy</a></p>
</main>
</body>
</html>
