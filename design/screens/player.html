<!-- @dsCard group="Screens" name="Player controls (landscape)" subtitle="TopBar (title/method) + transport row + Scrubber/Clock/picker row + Skip Intro" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; padding:24px; }
  .frame { width:640px; height:360px; position:relative; background:linear-gradient(135deg,#3a4a5f 0%,#202020 70%); overflow:hidden; }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.35); }
  .topbar { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:8px; }
  .icon-btn { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-btn svg { width:20px; height:20px; fill:#fff; }
  .title { flex:1; font-size:16px; font-weight:600; }
  .method { font-size:11px; font-weight:500; color:#00A4DC; padding-right:8px; }
  .transport { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:24px; }
  .transport svg.secondary { width:32px; height:32px; fill:#fff; }
  .transport svg.primary { width:48px; height:48px; fill:#fff; }
  .bottombar { position:absolute; left:16px; right:16px; bottom:12px; display:flex; flex-direction:column; gap:4px; }
  .scrub-track { height:4px; border-radius:2px; background:rgba(255,255,255,.3); position:relative; }
  .scrub-fill { height:100%; border-radius:2px; background:#00A4DC; width:27%; }
  .scrub-thumb { position:absolute; top:50%; left:27%; width:12px; height:12px; border-radius:50%; background:#00A4DC; transform:translate(-50%,-50%); }
  .picker-row { display:flex; align-items:center; }
  .clock { font-size:12px; flex:1; }
  .clock .dim { color:rgba(255,255,255,.7); }
  .picker-row .icon-btn svg { width:20px; height:20px; }
  .skip-btn { position:absolute; right:24px; bottom:64px; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:20px; background:#00A4DC; color:#000; font-size:13px; font-weight:500; }
  .skip-btn svg { width:18px; height:18px; fill:#000; }
</style>
<div class="frame">

  </div>
  <div class="transport">
    <svg class="secondary" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    <svg class="primary" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

  </div>

  <div class="bottombar">
    <div class="scrub-track"><div class="scrub-fill"></div><div class="scrub-thumb"></div></div>

      <div class="clock">14:36<span class="dim"> / 54:00</span></div>
