<!-- @dsCard group="Colors" name="Palette" subtitle="jellyfin-web dark theme, from core/ui JellyfinColors" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:640px; }
  .swatch { border-radius:12px; overflow:hidden; border:1px solid #3C3C3C; }
  .chip { height:64px; }
  .meta { padding:8px 10px; background:#202020; }
  .name { font-size:13px; font-weight:500; }
  .hex { font-size:11px; color:rgba(255,255,255,.6); font-family:ui-monospace,monospace; }
</style>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#101010"></div><div class="meta"><div class="name">Background</div><div class="hex">#101010</div></div></div>
  <div class="swatch"><div class="chip" style="background:#202020"></div><div class="meta"><div class="name">Surface</div><div class="hex">#202020</div></div></div>
  <div class="swatch"><div class="chip" style="background:#292929"></div><div class="meta"><div class="name">SurfaceVariant</div><div class="hex">#292929</div></div></div>
  <div class="swatch"><div class="chip" style="background:#3C3C3C"></div><div class="meta"><div class="name">Outline</div><div class="hex">#3C3C3C</div></div></div>
  <div class="swatch"><div class="chip" style="background:#00A4DC"></div><div class="meta"><div class="name">Primary</div><div class="hex">#00A4DC</div></div></div>
  <div class="swatch"><div class="chip" style="background:#AA5CC3"></div><div class="meta"><div class="name">Secondary</div><div class="hex">#AA5CC3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#CF6679"></div><div class="meta"><div class="name">Error</div><div class="hex">#CF6679</div></div></div>
  <div class="swatch"><div class="chip" style="background:rgba(255,255,255,.7)"></div><div class="meta"><div class="name">OnSurfaceVariant</div><div class="hex">#FFF @ 70%</div></div></div>
</div>
