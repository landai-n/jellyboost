[versions]
# Android SDK / toolchain
androidCompileSdk = "37"
androidCompileSdkMinor = "1"
androidMinSdk = "26"
androidTargetSdk = "36"
javaToolchain = "21"
jvmTarget = "17"

# Build plugins
androidGradlePlugin = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
detekt = "1.23.8"
ktlintPlugin = "14.2.0"
# Baseline profile generation (M10). The plugin, the macrobenchmark runner and the
# on-device profile installer all ship from androidx.benchmark / androidx.profileinstaller.
androidxBenchmark = "1.5.0-beta01"
androidxProfileinstaller = "1.4.1"
androidxTestUiautomator = "2.4.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Espresso is here only for `espresso-accessibility`, which packages Google's Accessibility Test
# Framework. Compose's `enableAccessibilityChecks()` runs ATF against the *semantics* tree, so no
# Espresso view interaction is ever written (accessibility audit 2026-08-05, CR-7).
androidxTestEspresso = "3.7.0"
junit4 = "4.13.2"

# KotlinX
coroutines = "1.11.0"
serialization = "1.11.0"

# AndroidX core
androidxCore = "1.19.0"
androidxSplashscreen = "1.2.0"
androidxActivity = "1.11.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
androidxPaging = "3.5.0"
androidxDatastore = "1.2.1"
androidxSecurityCrypto = "1.1.0"
androidxWork = "2.10.5"
androidxDocumentfile = "1.1.0"
androidxRoom = "2.8.4"
desugarJdkLibs = "2.1.5"

# DI
hilt = "2.60.1"
androidxHilt = "1.4.0"
# JSR-330 annotations only (`@Qualifier`, `@Inject`, `@Singleton`) — no processor, no Android. The
# one dependency `:core:common` needs to own the project's DI qualifiers (audit ARCH-1).
javaxInject = "1"

# Compose
composeBom = "2026.06.01"
# Backdrop blur behind the 2026-refresh glass chrome (DECISIONS.md 2026-08-01). Blur is real on
# API 31+; below that Haze degrades to a scrim on its own, so minSdk 26 stays supported.
haze = "1.7.2"

# Media
media3 = "1.9.0"
jellyfinMedia3Ffmpeg = "1.9.0+1"
# M12 Chromecast. The GMS Cast framework is pinned to exactly what media3-cast 1.9.0's POM
# declares — CastPlayer talks to it directly, so the two move together, not independently.
playServicesCast = "22.1.0"
# MediaRouter (the cast button and its chooser/controller dialogs) and AppCompat: both arrive
# transitively with the cast framework, declared here because `:player` uses their types itself
# (MediaRouteButton, and the AppCompat theme its dialogs inflate against).
androidxMediarouter = "1.8.1"
androidxAppcompat = "1.7.1"
# `MainActivity` has to be a FragmentActivity for MediaRouter's chooser dialog to open at all
# (DECISIONS.md 2026-07-31). Already in the graph transitively; declared because `:app` names the
# type.
androidxFragment = "1.8.9"

# Network / images
jellyfinSdk = "1.8.12"
okhttp = "5.4.0"
coil = "3.4.0"

# Third-party licence disclosure (GPL-3.0 distribution compliance). The Gradle plugin reads the
# resolved dependency graph at build time and the Compose artifact renders it; both ship from the
# same version, so they move together.
aboutlibraries = "15.1.1"

# Monitoring
timber = "5.0.1"
slf4jAndroid = "2.0.17-0"
slf4j = "2.0.17"

# Testing
junit = "6.1.2"
mockk = "1.14.11"
turbine = "1.2.1"
kotest = "6.2.3"

[plugins]
# NOTE: Android modules do NOT apply `org.jetbrains.kotlin.android` — AGP 9 has built-in
# Kotlin support and fails the build if that plugin is also applied (see DECISIONS.md).
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "androidxRoom" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }

# Convention plugins provided by the `build-logic` included build
jellyboost-android-application = { id = "jellyboost.android.application" }
jellyboost-android-library = { id = "jellyboost.android.library" }
jellyboost-android-library-compose = { id = "jellyboost.android.library.compose" }
jellyboost-android-feature = { id = "jellyboost.android.feature" }
jellyboost-android-hilt = { id = "jellyboost.android.hilt" }
jellyboost-android-room = { id = "jellyboost.android.room" }
jellyboost-kotlin-library = { id = "jellyboost.kotlin.library" }

[libraries]
# Gradle plugin artifacts (for build-logic convention plugins)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeGradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "androidxRoom" }

# KotlinX
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentfile" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidxSecurityCrypto" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# Process-wide foreground/background observation (ProcessLifecycleOwner): the SyncPlay presence
# coordinator re-checks a lost group membership when the app comes back to the user.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# Navigation / Paging / DataStore
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "androidxPaging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "androidxPaging" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "androidxPaging" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Instrumented Compose testing (versions from the BOM). `ui-test-manifest` is a *debug* dependency:
# it contributes the empty `ComponentActivity` that `createAndroidComposeRule` launches.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

# Media3
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
# Used by `:data:downloads`, not by the player: an audio sidecar is fetched as video+audio (the only
# shape the server hands a named `audioStreamIndex` over in) and transmuxed to audio-only on device.
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
# M12: `CastPlayer` — an `androidx.media3.common.Player` talking to a Cast receiver.
androidx-media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
jellyfin-media3-ffmpeg-decoder = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "jellyfinMedia3Ffmpeg" }

# Cast (M12) — all confined to `:player`'s `cast/` package so a GMS-less device never
# class-loads one of these types.
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "androidxMediarouter" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }

# Network / images
jellyfin-sdk = { group = "org.jellyfin.sdk", name = "jellyfin-core", version.ref = "jellyfinSdk" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Third-party licence disclosure. `aboutlibraries-core` parses the JSON the Gradle plugin emits;
# `aboutlibraries-compose-m3` draws it with the same Material 3 the rest of the app uses.
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutlibraries" }
aboutlibraries-compose-m3 = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

# Monitoring
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
# Runtime SLF4J binding for jellyfin-sdk's kotlin-logging calls; routes them to Logcat. Debug only.
slf4j-android = { group = "uk.uuid.slf4j", name = "slf4j-android", version.ref = "slf4jAndroid" }
# No-op SLF4J binding for release: keeps slf4j-api on the classpath (the SDK needs it) while
# discarding the SDK's request-URL logging instead of writing it to Logcat.
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }

# Testing
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core-jvm", version.ref = "kotest" }
# Test-only: the structural "every interface member is delegated" check in :data walks
# JellyfinRepository's members reflectively (audit ARCH-09). Never a production dependency.
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# Baseline profile generation (M10) — :baselineprofile module only
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiautomator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
# The Accessibility Test Framework, in the packaging Compose's `enableAccessibilityChecks()` looks
# for on the classpath. Never used through an Espresso `ViewAction`.
androidx-test-espresso-accessibility = { group = "androidx.test.espresso", name = "espresso-accessibility", version.ref = "androidxTestEspresso" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[bundles]
compose = [
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-compose-runtime",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
# Everything an instrumented Compose test needs, added to every Compose module by the Compose
# convention plugin. JUnit 4, not 5: the Android instrumentation runner has no JUnit Platform.
compose-ui-test = [
    "androidx-compose-ui-test-junit4",
    "androidx-test-espresso-accessibility",
    "androidx-test-ext-junit",
    "androidx-test-runner",
    "junit4",
]
unit-test = [
    "junit-jupiter-api",
    "junit-jupiter-params",
    "kotest-assertions",
    "kotlinx-coroutines-test",
    "mockk",
    "turbine",
]
