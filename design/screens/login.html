<!-- @dsCard group="Screens" name="Login (portrait)" subtitle="Verified against LoginScreen.kt: Sign-in pill fixed to white/#101010 loading-spinner variant (was solid accent-blue), Ghost pill fixed to white-on-glass (was accent-blue outline), fields fixed to caption-above eyebrow m-field, avatar ring fixed to flat primary/white@10% (was gray/gradient)" -->
<link rel="stylesheet" href="../_shared/modern.css">
<style>
  .phone{width:400px;min-height:900px;margin:0 auto;position:relative;overflow:hidden}
  .glow{position:absolute;inset:0 0 auto 0;height:420px}
  .content{position:relative;padding:32px 24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
  .ident{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sname{font-size:32px;font-weight:700;letter-spacing:-.02em}
  .version{font-size:12px;color:var(--on-surface-variant)}
  .picker{display:flex;flex-direction:column;gap:12px}
  .caption{text-align:center;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant)}
  .rowc{display:flex;justify-content:center;gap:32px}
  .user{display:flex;flex-direction:column;align-items:center;gap:8px}
  .uname{font-size:13px;font-weight:500;color:var(--on-surface-variant)}
  .user.selected .uname{color:#fff}
  .photo1{background:linear-gradient(160deg,#3a5f3f,#7fa06a 55%,#b0c4a0)}
  .photo2{background:linear-gradient(200deg,#e8e4de,#c9a86a 60%,#8a6f4d)}
  .heading{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-surface-variant)}
  .field-wrap{display:flex;flex-direction:column;gap:8px}
  .pw-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .eye{width:18px;height:18px;fill:none;stroke:var(--on-surface-variant);stroke-width:1.6;flex:none}
  .spin-dark{width:16px;height:16px;border-radius:50%;border:2px solid rgba(16,16,16,.3);border-top-color:#101010;animation:m-spin 1s linear infinite;flex:none}
  .divider-row{display:flex;align-items:center;gap:12px}
  .divider-row .line{flex:1;height:1px;background:var(--outline)}
  .divider-row .or{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
  .login-panel{gap:16px}
</style>
<div class="phone">
  <div class="glow brand-glow"></div>
  <div class="content">
    <div class="ident">
      <svg width="36" height="36" viewBox="0 0 168 142">
        <defs><linearGradient id="fin" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="164" y2="138"><stop offset="0" stop-color="#AA5CC3"/><stop offset="1" stop-color="#00A4DC"/></linearGradient></defs>
        <path fill="url(#fin)" d="M164 4 C118 18, 78 52, 60 98 C54 112, 52 126, 54 138 C90 136, 124 112, 144 78 C158 54, 164 28, 164 4 Z"/>
        <g stroke="url(#fin)" stroke-width="12" stroke-linecap="round" fill="none"><path d="M24 38 L74 38"/><path d="M10 72 L54 72"/><path d="M22 110 L42 110"/></g>
      </svg>
      <div class="sname">test-server</div>
      <div class="version">Version 10.11.0</div>
    </div>

    <div class="picker">
      <div class="caption">Who is watching?</div>
      <div class="rowc">
        <div class="user selected">
          <div class="m-avatar-ring selected"><div class="m-avatar-well"><div class="m-face photo1"></div></div></div>
          <div class="uname">Sam</div>
        </div>
        <div class="user">
          <div class="m-avatar-ring"><div class="m-avatar-well"><div class="m-face photo2"></div></div></div>
          <div class="uname">Alex</div>
        </div>
      </div>
    </div>

    <div class="m-panel login-panel">
      <div class="heading">Sign in</div>
      <div class="field-wrap">
        <div class="eyebrow">Username</div>
        <div class="m-field filled">Sam</div>
      </div>
      <div class="field-wrap">
        <div class="eyebrow">Password</div>
        <div class="m-field filled pw-row">
          <span>••••••••</span>
          <svg class="eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
      <div class="m-btn m-btn-primary m-btn-block"><div class="spin-dark"></div>Sign in</div>
      <div class="note" style="font-size:11px;color:rgba(255,255,255,.45)">^ PrimaryPillButton(loading&nbsp;=&nbsp;true): normal enabled white/#101010 colors, leading slot swapped for an inline spinner.</div>
      <div class="divider-row"><div class="line"></div><div class="or">Or</div><div class="line"></div></div>
      <div class="m-btn m-btn-ghost m-btn-block">Use Quick Connect</div>
      <div class="m-link" style="text-align:center">Use a different server</div>
    </div>
  </div>
</div>
