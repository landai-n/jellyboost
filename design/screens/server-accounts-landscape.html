<!-- @dsCard viewport="1000x620" group="Screens" name="Saved accounts (landscape tablet)" subtitle="Two-pane ≥840dp: server identity left (mirrors login-landscape), saved-account chips + escape hatches right" -->
<link rel="stylesheet" href="../_shared/modern.css">
<style>
  .tablet{width:1000px;height:620px;margin:0 auto;position:relative;overflow:hidden}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 90% 85% at 28% 0%,rgba(170,92,195,.20) 0%,rgba(0,164,220,.09) 45%,rgba(0,0,0,0) 78%)}
  .pair{position:relative;display:grid;grid-template-columns:1fr 1px 1fr;gap:40px;align-items:center;max-width:920px;height:100%;margin:0 auto;padding:0 24px;box-sizing:border-box}
  .rule{align-self:stretch;margin:64px 0;background:linear-gradient(180deg,transparent,var(--outline) 20%,var(--outline) 80%,transparent)}
  .identity{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .sname{font-size:32px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .version{font-size:12px;color:var(--on-surface-variant)}
  .live{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:rgba(0,164,220,.14);border:1px solid rgba(0,164,220,.30);font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--primary);white-space:nowrap}
  .live .d{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:lp 1.6s ease-in-out infinite}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.35}}
  .panel-col{display:flex;flex-direction:column;gap:14px}
  .caption{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-surface-variant)}
  .chips{display:flex;flex-direction:column;gap:10px}
  .chip{display:flex;align-items:center;gap:12px;height:60px;padding:0 16px 0 10px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--glass-line);box-sizing:border-box}
  .av{width:40px;height:40px;border-radius:50%;position:relative;flex:none}
  .av .face{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
  .photo1{background:linear-gradient(160deg,#3a5f3f,#7fa06a 55%,#b0c4a0)}
  .photo2{background:linear-gradient(200deg,#e8e4de,#c9a86a 60%,#8a6f4d)}
  .letter{background:var(--primary);color:#101010}
  .kb{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--error);border:2px solid var(--background);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#101010;box-sizing:content-box}
  .tx{flex:1;min-width:0}
  .nm{font-size:14px;font-weight:600}
  .sb{font-size:12px;color:var(--on-surface-variant);margin-top:1px}
  .sb.err{color:var(--error-fg)}
  .chev{color:var(--on-surface-variant);font-size:20px;flex:none}
  .divider-row{display:flex;align-items:center;gap:12px}
  .divider-row .line{flex:1;height:1px;background:var(--outline)}
  .divider-row .or{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}
</style>
<div class="tablet">
  <div class="glow"></div>
  <div class="pair">
    <div class="identity">
      <svg width="36" height="36" viewBox="0 0 168 142">
        <defs><linearGradient id="fin" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="164" y2="138"><stop offset="0" stop-color="#AA5CC3"/><stop offset="1" stop-color="#00A4DC"/></linearGradient></defs>
        <path fill="url(#fin)" d="M164 4 C118 18, 78 52, 60 98 C54 112, 52 126, 54 138 C90 136, 124 112, 144 78 C158 54, 164 28, 164 4 Z"/>
        <g stroke="url(#fin)" stroke-width="12" stroke-linecap="round" fill="none"><path d="M24 38 L74 38"/><path d="M10 72 L54 72"/><path d="M22 110 L42 110"/></g>
      </svg>
      <div class="sname">lighthouse <span class="live"><span class="d"></span>On this network</span></div>
      <div class="version">http://192.168.1.10:8096 · Version 10.11.0</div>
    </div>
    <div class="rule"></div>
    <div class="panel-col">
      <div class="caption">On this device</div>
      <div class="chips">
        <div class="chip">
          <div class="av"><div class="face photo1"></div></div>
          <div class="tx"><div class="nm">Sam</div><div class="sb">Last used today</div></div>
          <div class="chev">&#8250;</div>
        </div>
        <div class="chip">
          <div class="av"><div class="face photo2"></div><div class="kb">!</div></div>
          <div class="tx"><div class="nm">Alex</div><div class="sb err">Signed out — tap to sign in again</div></div>
          <div class="chev">&#8250;</div>
        </div>
        <div class="chip">
          <div class="av"><div class="face letter">M</div></div>
          <div class="tx"><div class="nm">Mika</div><div class="sb">Last used Jun 12</div></div>
          <div class="chev">&#8250;</div>
        </div>
      </div>
      <div class="divider-row"><div class="line"></div><div class="or">Or</div><div class="line"></div></div>
      <div class="m-btn m-btn-ghost m-btn-block">Sign in as someone else</div>
      <div class="m-link" style="text-align:center">Use a different server</div>
    </div>
  </div>
</div>
