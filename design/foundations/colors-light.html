<!-- @dsCard group="Colors" name="Palette — Light" subtitle="Light theme tokens, via data-theme=&quot;light&quot; — Primary, Outline and OnSurfaceVariant carry the contrast remediation" -->
<style>
body{margin:0;background:#EEF1F7;color:#191B22;font-family:Roboto,"Segoe UI",system-ui,sans-serif;padding:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px}
.swatch{border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(46,54,92,.08)}
.chip{height:64px}
.meta{padding:8px 10px}
.name{font-size:13px;font-weight:500}
.hex{font-size:11px;color:rgba(31,35,48,.78);font-family:ui-monospace,monospace}
</style>
<div class="grid">
<div class="swatch"><div class="chip" style="background:#EEF1F7"></div><div class="meta"><div class="name">Background</div><div class="hex">#EEF1F7</div></div></div>
<div class="swatch"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid #E3E8F2"></div><div class="meta"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
<div class="swatch"><div class="chip" style="background:#E3E8F2"></div><div class="meta"><div class="name">SurfaceVariant</div><div class="hex">#E3E8F2</div></div></div>
<div class="swatch"><div class="chip" style="background:#788AB0"></div><div class="meta"><div class="name">Outline</div><div class="hex">#788AB0</div></div></div>
<div class="swatch"><div class="chip" style="background:#00769E"></div><div class="meta"><div class="name">Primary</div><div class="hex">#00769E</div></div></div>
<div class="swatch"><div class="chip" style="background:#9A4DB4"></div><div class="meta"><div class="name">Secondary</div><div class="hex">#9A4DB4</div></div></div>
<div class="swatch"><div class="chip" style="background:#B3261E"></div><div class="meta"><div class="name">Error</div><div class="hex">#B3261E</div></div></div>
<div class="swatch"><div class="chip" style="background:rgba(31,35,48,.78)"></div><div class="meta"><div class="name">OnSurfaceVariant</div><div class="hex">#1F2330 @ 78%</div></div></div>
</div>
