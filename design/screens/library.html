<!-- @dsCard group="Screens" name="Library grid (portrait)" subtitle="TopAppBar (Back/Home, Sort, Filter+badge) + adaptive 3-col PosterCard grid" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; }
  .phone { width:400px; margin:0 auto; }
  .topbar { height:56px; display:flex; align-items:center; padding:0 4px; gap:4px; background:#202020; }
  .icon-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-btn svg { width:22px; height:22px; fill:rgba(255,255,255,.85); }
  .title { flex:1; font-size:22px; margin-left:4px; }
  .badge-wrap { position:relative; }
  .count-badge { position:absolute; top:2px; right:2px; min-width:16px; height:16px; border-radius:8px; background:#CF6679; color:#101010; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px; }
  .card { display:flex; flex-direction:column; }
  .art { position:relative; width:100%; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:linear-gradient(135deg,#292929,#202020); }
  .ttl { margin-top:8px; font-size:12px; line-height:16px; }
  .sub { font-size:11px; color:rgba(255,255,255,.7); }
  .progress-track { position:absolute; bottom:0; left:0; right:0; height:4px; background:rgba(0,0,0,.5); }
  .progress-fill { height:100%; background:#00A4DC; }
  .badge { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .badge svg { width:14px; height:14px; }
  .watched { position:absolute; top:4px; left:4px; }
  .watched svg { width:14px; height:14px; fill:#00A4DC; }
  .ring { width:14px; height:14px; border-radius:50%; border:2px solid #00A4DC; border-top-color:rgba(0,164,220,.25); }
</style>
<div class="phone">
  <div class="topbar">
    <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
    <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
    <div class="title">Movies</div>
    <div class="icon-btn"><svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg></div>
    <div class="icon-btn badge-wrap"><svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg><div class="count-badge">2</div></div>
  </div>
  <div class="grid">
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#3a4a5f,#5f7a9a)"><div class="progress-track"><div class="progress-fill" style="width:30%"></div></div></div><div class="ttl">Arrival</div><div class="sub">2016</div></div>
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#3a5f3f,#7fa06a)"><div class="watched"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div></div><div class="ttl">Dune</div><div class="sub">2021</div></div>
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#5f4a3a,#9a7a5f)"><div class="badge"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 3v6h2.5L12 15.5 7.5 11H10V5h3z" fill="#00A4DC"/></svg></div></div><div class="ttl">Blade Runner 2049</div><div class="sub">2017</div></div>
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#4a3a5f,#7a5f9a)"><div class="badge"><div class="ring"></div></div></div><div class="ttl">Nope</div><div class="sub">2022</div></div>
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#5f3a4a,#9a5f7a)"></div><div class="ttl">Prisoners</div><div class="sub">2013</div></div>
    <div class="card"><div class="art" style="background:linear-gradient(160deg,#3a5f5a,#6fa09a)"></div><div class="ttl">Annihilation</div><div class="sub">2018</div></div>
  </div>
</div>
