# Gradle
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Release version identity — Play rejects an upload whose versionCode is not
# strictly higher than the last accepted one.
jellyboost.versionCode=1
jellyboost.versionName=1.0.0
