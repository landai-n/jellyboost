<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; }
  .phone { width:400px; margin:0 auto; }
  .topbar { height:56px; display:flex; align-items:center; padding:0 4px; gap:4px; background:#202020; }
  .tabs { display:flex; gap:4px; flex:1; }
  .tab { flex:1; height:48px; border-radius:24px; display:flex; align-items:center; justify-content:center; }
  .tab.selected { background:#4A4458; }
  .tab svg { width:22px; height:22px; fill:rgba(255,255,255,.7); }
  .tab.selected svg { fill:#E8DEF8; }
  .topbar-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .topbar-icon svg { width:22px; height:22px; fill:rgba(255,255,255,.7); }
  .content { display:flex; flex-direction:column; gap:24px; padding:16px 0; }
  .section { padding:0 16px; display:flex; flex-direction:column; gap:8px; }
  .section-header { display:flex; align-items:center; justify-content:space-between; }
  .section-title { font-size:16px; font-weight:600; }
  .see-all { font-size:14px; font-weight:500; color:#00A4DC; }
  .row { display:flex; gap:12px; overflow:hidden; }
  .card { flex:none; }
  .thumb-art { position:relative; width:160px; height:90px; border-radius:8px; overflow:hidden; background:linear-gradient(135deg,#292929,#202020); }
  .poster-art { position:relative; width:120px; height:180px; border-radius:8px; overflow:hidden; background:linear-gradient(135deg,#292929,#202020); }
  .ttl { margin-top:8px; font-size:14px; }
  .sub { font-size:12px; color:rgba(255,255,255,.7); }
  .progress-track { position:absolute; bottom:0; left:0; right:0; height:4px; background:rgba(0,0,0,.5); }
  .progress-fill { height:100%; background:#00A4DC; }
  .badge { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .badge svg { width:16px; height:16px; }
  .watched { position:absolute; top:4px; left:4px; }
  .watched svg { width:16px; height:16px; fill:#00A4DC; }
</style>
