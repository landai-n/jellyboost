<!-- @dsCard group="Screens" name="Connection screen (portrait)" subtitle="Brand hero over BrandGlow, server cards, manual panel" -->
<style>
  body { margin:0; background:#101010; color:#fff; font-family:Roboto,"Segoe UI",system-ui,sans-serif; }
  .phone { width:400px; min-height:760px; margin:0 auto; position:relative; overflow:hidden; }
  .glow { position:absolute; inset:0 0 auto 0; height:420px; background:radial-gradient(circle at 50% 8%,rgba(170,92,195,.20) 0%,rgba(0,164,220,.09) 45%,transparent 100%); }
  .content { position:relative; padding:32px 24px; display:flex; flex-direction:column; gap:16px; }
  .hero { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .wordmark { font-size:32px; font-weight:700; background:linear-gradient(90deg,#AA5CC3,#00A4DC); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline { font-size:14px; color:rgba(255,255,255,.7); }
  .title { font-size:22px; }
  .section { font-size:14px; font-weight:500; color:rgba(255,255,255,.7); }
  .card { display:flex; align-items:center; gap:16px; background:#292929; border-radius:16px; padding:12px 16px; }
  .badge { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#AA5CC3,#00A4DC); flex:none; }
  .name { font-size:16px; font-weight:600; }
  .addr { font-size:12px; color:rgba(255,255,255,.7); }
  .chev { margin-left:auto; color:rgba(255,255,255,.7); font-size:20px; }
  .panel { background:#202020; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .field { border:1px solid #3C3C3C; border-radius:4px; padding:16px; font-size:16px; color:rgba(255,255,255,.5); }
  .btn { border-radius:24px; padding:12px; text-align:center; font-size:14px; font-weight:500; background:#292929; color:rgba(255,255,255,.4); }
</style>
<div class="phone">
  <div class="glow"></div>
  <div class="content">
    <div class="hero">
      <svg width="105" height="88" viewBox="0 0 168 142"><defs><linearGradient id="f" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="164" y2="138"><stop offset="0" stop-color="#AA5CC3"/><stop offset="1" stop-color="#00A4DC"/></linearGradient></defs><path fill="url(#f)" d="M164 4 C118 18, 78 52, 60 98 C54 112, 52 126, 54 138 C90 136, 124 112, 144 78 C158 54, 164 28, 164 4 Z"/><g stroke="url(#f)" stroke-width="12" stroke-linecap="round" fill="none"><path d="M24 38 L74 38"/><path d="M10 72 L54 72"/><path d="M22 110 L42 110"/></g></svg>
      <div class="wordmark">Jellyboost</div>
      <div class="tagline">Your Jellyfin library, native on Android.</div>
    </div>
    <div class="title">Connect to server</div>
    <div class="section">Servers on this network</div>
    <div class="card"><div class="badge"></div><div><div class="name">test-server</div><div class="addr">http://192.168.1.10:8096</div></div><div class="chev">&#8250;</div></div>
    <div class="panel">
      <div class="section">Server address</div>
      <div class="field">Host or URL</div>
      <div class="btn">Connect</div>
    </div>
  </div>
</div>
