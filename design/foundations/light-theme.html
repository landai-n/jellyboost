<link rel="stylesheet" href="../_shared/modern.css">
<style>body{padding:24px}.col{display:flex;flex-direction:column;gap:20px;max-width:560px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}</style>
<body data-theme="light">
<div class="col">
